{% extends "base.html" %}

{% block title %}Registro de usuario | Sistema Vehículos{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-4">Crear cuenta</h3>

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    {% if form.errors %}
                        <div class="alert alert-danger py-2 small" role="alert">
                            Registro incorrecto. Inténtelo nuevamente.
                        </div>
                    {% endif %}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-dark">Registrarse</button>
                    </div>
                </form>

                <hr class="my-4">

                <div class="text-center small">
                    ¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-decoration-none">Inicia sesión aquí</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
