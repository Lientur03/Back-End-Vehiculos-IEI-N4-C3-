{% extends 'base.html' %}

{% block title %}Crear Antecedente{% endblock %}

{% block content %}
<h3>Agregar Antecedente</h3>
<br>

<div class="row">
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row">
            <div class="col">
                <label for="id_vehiculo" class="form-label">Vehículo:</label>
                {{ form.vehiculo }}
            </div>

            <div class="col">
                <label for="id_fecha_evento" class="form-label">Fecha del Evento:</label>
                {{ form.fecha_evento }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_tipo_antecedente" class="form-label">Tipo de Antecedente:</label>
                {{ form.tipo_antecedente }}
            </div>

            <div class="col">
                <label for="id_archivo_adjunto" class="form-label">Archivo Adjunto:</label>
                {{ form.archivo_adjunto }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_descripcion" class="form-label">Descripción:</label>
                {{ form.descripcion }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <button type="reset" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
