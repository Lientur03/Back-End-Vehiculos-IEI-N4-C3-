{% extends 'base.html' %}

{% block title %}Crear Información Privada{% endblock %}

{% block content %}
<h3>Agregar Información Privada / Restringida</h3>
<br>

<div class="row">
    <form action="" method="post">
        {% csrf_token %}

        <div class="row">
            <div class="col">
                <label for="id_titulo" class="form-label">Título:</label>
                {{ form.titulo }}
            </div>

            <div class="col">
                <label for="id_perfil_autorizado" class="form-label">Perfil Autorizado:</label>
                {{ form.perfil_autorizado }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_contenido_sensible" class="form-label">Contenido Sensible:</label>
                {{ form.contenido_sensible }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <button type="reset" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}

</script>
{% endblock %}
