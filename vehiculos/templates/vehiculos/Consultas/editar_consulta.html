{% extends 'base.html' %}

{% block title %}Editar Consulta Guardada{% endblock %}

{% block content %}
<h3>Editar Consulta</h3>
<br>

<div class="row">
    <form action="" method="post">
        {% csrf_token %}

        <div class="row">
            <div class="col">
                <label for="id_usuario" class="form-label">Usuario:</label>
                {{ form.usuario }}
            </div>

            <div class="col">
                <label for="id_nombre_consulta" class="form-label">Nombre de Consulta:</label>
                {{ form.nombre_consulta }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_criterios_busqueda" class="form-label">Criterios de Búsqueda (JSON):</label>
                {{ form.criterios_busqueda }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <a href="{% url 'listar_consultas' %}" class="btn btn-secondary">Volver</a>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
