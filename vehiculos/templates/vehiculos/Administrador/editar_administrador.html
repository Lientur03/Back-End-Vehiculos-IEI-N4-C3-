{% extends 'base.html' %}

{% block title %}Editar Administrador{% endblock %}

{% block content %}
<h3>Editar Administrador</h3>
<br>

<div class="row">
    <form action="" method="post">
        {% csrf_token %}

        <div class="row">
            <div class="col">
                <label for="id_nombre" class="form-label">Nombre:</label>
                {{ form.nombre }}
            </div>

            <div class="col">
                <label for="id_correo" class="form-label">Correo:</label>
                {{ form.correo }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <a href="{% url 'listar_administradores' %}" class="btn btn-secondary">Volver</a>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
