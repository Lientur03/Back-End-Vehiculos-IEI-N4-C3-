{% extends 'base.html' %}

{% block title %}Crear Estado{% endblock %}

{% block content %}
<h3>Agregar Estado</h3>
<br>

<div class="row">
    <form action="" method="post">
        {% csrf_token %}

        <div class="row">
            <div class="col">
                <label for="id_nombre" class="form-label">Nombre:</label>
                {{ form.nombre }}
            </div>

            <div class="col">
                <label for="id_es_activo" class="form-label">Es Activo:</label>
                {{ form.es_activo }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_descripcion" class="form-label">Descripción:</label>
                {{ form.descripcion }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <button type="reset" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
