{% extends 'base.html' %}

{% block title %}Crear Excepcional / Incidencia{% endblock %}

{% block content %}
<h3>Agregar Excepcional</h3>
<br>

<div class="row">
    <form action="" method="post">
        {% csrf_token %}

        <div class="row">
            <div class="col">
                <label for="id_operacion" class="form-label">Operación:</label>
                {{ form.operacion }}
            </div>

            <div class="col">
                <label for="id_titulo" class="form-label">Título:</label>
                {{ form.titulo }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_nivel_prioridad" class="form-label">Nivel de Prioridad:</label>
                {{ form.nivel_prioridad }}
            </div>

            <div class="col">
                <label for="id_resuelto" class="form-label">Resuelto:</label>
                {{ form.resuelto }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_descripcion" class="form-label">Descripción:</label>
                {{ form.descripcion }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <button type="reset" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
