{% extends 'base.html' %}

{% block title %}Crear Análisis de Tendencia{% endblock %}

{% block content %}
<h3>Agregar Tendencia</h3>
<br>

<div class="row">
    <form action="" method="post">
        {% csrf_token %}

        <div class="row">
            <div class="col">
                <label for="id_indicador" class="form-label">Indicador Asociado:</label>
                {{ form.indicador }}
            </div>

            <div class="col">
                <label for="id_periodo" class="form-label">Periodo:</label>
                {{ form.periodo }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_porcentaje_variacion" class="form-label">Porcentaje de Variación (%):</label>
                {{ form.porcentaje_variacion }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_interpretacion" class="form-label">Interpretación:</label>
                {{ form.interpretacion }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <button type="reset" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}

</script>
{% endblock %}
